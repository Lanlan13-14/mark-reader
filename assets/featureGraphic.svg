<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!--
    Source of fastlane/metadata/android/en-US/images/featureGraphic.png.
    The fonts are the app's bundled ones, referenced rather than embedded, so render from a
    checkout with Chrome and flatten to RGB: Play rejects a feature graphic with alpha.
  -->
  <defs>
    <style>
      @font-face { font-family: "Merriweather"; font-weight: 700; src: url("../app/src/main/res/font/merriweather_bold.ttf"); }
      @font-face { font-family: "Merriweather Sans"; font-weight: 400; src: url("../app/src/main/res/font/merriweather_sans_regular.ttf"); }
      .title { font-family: "Merriweather", Georgia, serif; font-weight: 700; font-size: 76px; letter-spacing: -1px; fill: #1F1F22; }
      .tagline { font-family: "Merriweather Sans", "Segoe UI", Roboto, sans-serif; font-size: 24px; fill: #5B5B60; }
    </style>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#007AFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1C1C2E" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1C1C2E" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="#FFFFFF"/>
  <circle cx="40" cy="-20" r="210" fill="url(#glow)"/>
  <circle cx="1084" cy="520" r="260" fill="url(#glow)" opacity="0.9"/>

  <!-- Icon tile, the launcher foreground's paths scaled from its 108-unit viewport. The halo and
       the heavier shadow are what separate a white tile from a white page. -->
  <circle cx="266" cy="254" r="150" fill="url(#halo)"/>
  <g filter="url(#tileShadow)">
    <rect x="191" y="175" width="150" height="150" rx="40" fill="#FFFFFF" stroke="#D5DAE3" stroke-width="1.5"/>
  </g>
  <svg x="207" y="191" width="118" height="118" viewBox="27 27 54 54">
    <path fill="#3A3A3C" d="M29,68V40h8l8,18l8,-18h8v28h-6V50l-10,18l-10,-18v18z"/>
    <path fill="#007AFF" d="M67,40h8v14h4l-8,14l-8,-14h4z"/>
  </svg>

  <!-- Wordmark -->
  <text x="381" y="253" class="title">MarkReader</text>
  <text x="381" y="305" class="tagline">Markdown and code. <tspan fill="#007AFF">Offline.</tspan></text>
</svg>
