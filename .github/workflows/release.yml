name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-24.04

    steps:
      # fetch-depth: 0 so auto-generated release notes can find the previous tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Guard: the exact tagged commit is re-tested before we ship a signed APK.
      # Lint is skipped here — it's static and already covered on the PR.
      - name: Run renderer and search regression tests
        run: |
          node --test scripts/webview-search.test.mjs
          node --experimental-default-type=module tests/renderer/math.test.mjs

      - name: Run unit tests
        run: ./gradlew test

      - name: Prepare signing key
        env:
          STORED_KEYSTORE: ${{ secrets.KEYSTORE_FILE }}
          STORED_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORED_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORED_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          KEYSTORE="$RUNNER_TEMP/release.jks"
          if [ -n "$STORED_KEYSTORE" ]; then
            test -n "$STORED_STORE_PASSWORD"
            test -n "$STORED_ALIAS"
            test -n "$STORED_KEY_PASSWORD"
            printf '%s' "$STORED_KEYSTORE" | base64 -d > "$KEYSTORE"
            PASSWORD="$STORED_STORE_PASSWORD"
            ALIAS="$STORED_ALIAS"
            KEY_PASSWORD="$STORED_KEY_PASSWORD"
          else
            PASSWORD=$(openssl rand -base64 24)
            echo "::add-mask::$PASSWORD"
            ALIAS=markreader
            KEY_PASSWORD="$PASSWORD"
            keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=Mark Reader test"
            echo '::warning::Automatically generated a temporary signing certificate. This APK cannot update previous installs signed with another certificate.'
          fi
          chmod 600 "$KEYSTORE"
          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/mark-reader-${{ github.ref_name }}.apk

      # Auto-generated notes: categorized PR list + "New Contributors" + compare
      # link. CHANGELOG.md is intentionally NOT used here (kept in-repo for
      # convention; the Release page is the auto-generated view).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/mark-reader-${{ github.ref_name }}.apk
